name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Get the site files
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Create the Android project
        run: |
          set -e
          APP="$RUNNER_TEMP/app"
          mkdir -p "$APP/www"
          cp index.html icon-512.png "$APP/www/"
          cd "$APP"
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/filesystem@6 @capacitor/share@6
          npx cap telemetry off || true
          npx cap init "دفتر کنکور" com.konkur.notebook --web-dir www
          npx cap add android
          npx cap sync android
          echo "APP=$APP" >> "$GITHUB_ENV"

      - name: Set the app icon
        run: |
          set -e
          cd "$APP"
          RES=android/app/src/main/res
          rm -rf "$RES/mipmap-anydpi-v26"
          for pair in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            d="${pair%%:*}"; s="${pair##*:}"
            for n in ic_launcher ic_launcher_round ic_launcher_foreground; do
              convert www/icon-512.png -resize "${s}x${s}" "$RES/mipmap-$d/$n.png"
            done
          done

      - name: Build the APK
        run: |
          set -e
          cd "$APP/android"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/konkur-notebook.apk"

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="apk-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" konkur-notebook.apk --title "Konkur Notebook APK" --notes "Android APK build" --target "$GITHUB_SHA"
